<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every Ball That Escapes Creates 2 More</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }
        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            background: #0b0f19;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .subtitle {
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .counter-display {
            font-size: 2.2rem;
            font-weight: 900;
            color: #38bdf8;
            margin-top: 8px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        .controls {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 10px;
            background: rgba(30, 41, 59, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        button {
            background: #38bdf8;
            border: none;
            color: #0b0f19;
            padding: 8px 16px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }
        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
        button.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="ui-overlay">
            <h1>Every Ball That Escapes</h1>
            <div class="subtitle">Creates 2 More[cite: 2]</div>
            <div class="counter-display" id="counter">BALLS: 10[cite: 2]</div>
        </div>

        <canvas id="simCanvas"></canvas>

        <div class="controls">
            <button onclick="resetSim()">Reset (10)</button>
            <button class="secondary" onclick="addBalls(10)">+10 Balls</button>
            <button class="secondary" onclick="toggleSound()">Sound: <span id="soundStatus">OFF</span></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const counterEl = document.getElementById('counter');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let soundEnabled = false;
        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundStatus').innerText = soundEnabled ? 'ON' : 'OFF';
        }

        function playSound(freq = 400) {
            if (!soundEnabled) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        // Simulation parameters
        let ringRadius = Math.min(window.innerWidth, window.innerHeight) * 0.35;
        let ringAngle = 0;
        const ringSpeed = 0.015;
        const gapSize = Math.PI / 4; // Opening angle width

        const colors = ['#f43f5e', '#fb923c', '#facc15', '#4ade80', '#38bdf8', '#c084fc', '#f472b6'];

        class Ball {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = 5;
                this.color = color || colors[Math.floor(Math.random() * colors.length)];
                this.escaped = false;
            }

            update() {
                this.vy += 0.15; // Gravity
                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        let balls = [];

        function initBalls(count) {
            balls = [];
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 2 + 1;
                balls.push(new Ball(cx, cy, Math.cos(angle) * speed, Math.sin(angle) * speed));
            }
        }

        initBalls(10);

        function resetSim() {
            initBalls(10);
        }

        function addBalls(n) {
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            for (let i = 0; i < n; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 3 + 1;
                balls.push(new Ball(cx, cy, Math.cos(angle) * speed, Math.sin(angle) * speed));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(11, 15, 25, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            ringRadius = Math.min(canvas.width, canvas.height) * 0.35;

            // Rotate ring
            ringAngle += ringSpeed;

            // Draw circular barrier with a gap
            ctx.beginPath();
            ctx.arc(cx, cy, ringRadius, ringAngle + gapSize / 2, ringAngle + Math.PI * 2 - gapSize / 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 10;
            ctx.stroke();
            ctx.shadowBlur = 0; // reset shadow
            ctx.closePath();

            let newBallsBuffer = [];

            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                b.update();
                b.draw();

                let dx = b.x - cx;
                let dy = b.y - cy;
                let dist = Math.sqrt(dx * dx + dy * dy);

                // Check collision with ring perimeter
                if (!b.escaped && dist >= ringRadius - b.radius) {
                    let angleFromCenter = Math.atan2(dy, dx);
                    
                    // Normalize angle relative to ring rotation
                    let relAngle = (angleFromCenter - ringAngle) % (Math.PI * 2);
                    if (relAngle < 0) relAngle += Math.PI * 2;

                    // Check if ball is inside the gap region
                    let inGap = (relAngle > (Math.PI * 2 - gapSize / 2) || relAngle < gapSize / 2);

                    if (inGap) {
                        // Escaped! Mark and trigger duplication rule: 1 ball escapes -> creates 2 more
                        b.escaped = true;
                        playSound(600);
                        
                        // Spawn 2 new replacement/multiplier balls at the center
                        let col1 = colors[Math.floor(Math.random() * colors.length)];
                        let col2 = colors[Math.floor(Math.random() * colors.length)];
                        let a1 = Math.random() * Math.PI * 2;
                        let a2 = Math.random() * Math.PI * 2;
                        
                        newBallsBuffer.push(new Ball(cx, cy, Math.cos(a1) * 4, Math.sin(a1) * 4, col1));
                        newBallsBuffer.push(new Ball(cx, cy, Math.cos(a2) * 4, Math.sin(a2) * 4, col2));
                    } else {
                        // Bounce off the ring wall
                        let normalX = dx / dist;
                        let normalY = dy / dist;
                        let dot = b.vx * normalX + b.vy * normalY;
                        b.vx = (b.vx - 2 * dot * normalX) * 0.8;
                        b.vy = (b.vy - 2 * dot * normalY) * 0.8;
                        
                        // Push back inside
                        b.x = cx + normalX * (ringRadius - b.radius - 1);
                        b.y = cy + normalY * (ringRadius - b.radius - 1);
                        playSound(200);
                    }
                }

                // Remove balls that fly too far out of bounds
                if (dist > Math.max(canvas.width, canvas.height)) {
                    balls.splice(i, 1);
                }
            }

            // Append newly created duplicate balls
            if (newBallsBuffer.length > 0) {
                balls.push(...newBallsBuffer);
            }

            // Update counter UI
            counterEl.innerText = `BALLS: ${balls.length}`;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
